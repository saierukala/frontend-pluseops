name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────
  # 1. quality — types, lint (0 errors) and a production build
  # ──────────────────────────────────────────────────────────
  quality:
    name: typecheck · lint · build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/api/v1
      NEXT_PUBLIC_SOCKET_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  # ──────────────────────────────────────────────────────────
  # 2. docker — the production image builds
  # ──────────────────────────────────────────────────────────
  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: pulseops-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────
  # 3. e2e — Playwright against the production build and a freshly
  #    migrated + seeded backend (saierukala/backend-pluseops)
  # ──────────────────────────────────────────────────────────
  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulseops
          POSTGRES_PASSWORD: pulseops
          POSTGRES_DB: pulseops
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U pulseops -d pulseops"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/api/v1
      NEXT_PUBLIC_SOCKET_URL: http://localhost:3000
      E2E_BASE_URL: http://localhost:3001
      # Throwaway account that exists only in this job's database
      E2E_PLATFORM_EMAIL: platform.e2e@pulseops.test
      E2E_PLATFORM_PASSWORD: E2e-Platform#2026
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: saierukala/backend-pluseops
          ref: main
          path: backend
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Start backend (migrate, seed, serve)
        working-directory: backend
        env:
          # development: the storefront hands back sign-up codes instead of emailing them
          NODE_ENV: development
          PORT: 3000
          DATABASE_URL: postgresql://pulseops:pulseops@localhost:5432/pulseops?schema=public
          REDIS_URL: redis://localhost:6379
          CORS_ORIGINS: http://localhost:3001
          APP_URL: http://localhost:3001
          JWT_ACCESS_SECRET: e2e-access-secret-min-32-chars-long-for-ci
          JWT_REFRESH_SECRET: e2e-refresh-secret-min-32-chars-long-for-ci
          PAYMENT_WEBHOOK_SECRET: e2e-webhook-secret-min-32-chars-long-for-ci
          STORAGE_PROVIDER: local
          LOCAL_STORAGE_PATH: ./storage
          RATE_LIMIT_MAX: 10000
          AUTH_RATE_LIMIT_MAX: 1000
          PLATFORM_ADMIN_EMAIL: ${{ env.E2E_PLATFORM_EMAIL }}
          PLATFORM_ADMIN_PASSWORD: ${{ env.E2E_PLATFORM_PASSWORD }}
        run: |
          npm ci
          npx prisma migrate deploy
          npm run db:seed
          nohup npm start > ../api.log 2>&1 &
          npx --yes wait-on@8.0.3 --timeout 60000 http-get://localhost:3000/health
          npm run db:seed:demo

      - name: Build and start web app
        run: |
          npm ci
          npm run build
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          PORT=3001 HOSTNAME=127.0.0.1 nohup node .next/standalone/server.js > web.log 2>&1 &
          npx --yes wait-on@8.0.3 --timeout 60000 http-get://localhost:3001/login

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run e2e tests
        run: npx playwright test

      - name: Server logs
        if: failure()
        run: |
          tail -n 200 api.log || true
          tail -n 100 web.log || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
